version: '3.8'

services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/fitness.db
    volumes:
      - ./data:/app/data   # бд на хосте
    restart: "no"   
    profiles:
      - migrations         # запускается только с флагом --profile migrations
    working_dir: /src/API

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Режим работы: Web (Razor Pages) или Api (Swagger)
      - AuthMode=Api 
      # переопределение настроек из appsettings.json
      - Jwt__Key=your-super-secret-key-change-me-in-production
      - Jwt__Issuer=FitnessCenter
      - Jwt__Audience=FitnessCenterClient
      - Jwt__ExpiryMinutes=60
      - AdminSettings__Email=admin@fitness.com
      - AdminSettings__Password=Admin123!
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/fitness.db
      # логирование 
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    volumes:
      - ./data:/app/data   # папка с бд
    depends_on: []
    restart: unless-stopped
    

  # Web UI если нужно параллельно
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "6000:8080"
  #     - "6001:443"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - AuthMode=Web
  #     - AdminSettings__Email=admin@fitness.com
  #     - AdminSettings__Password=Admin123!
  #     - ConnectionStrings__SqliteConnection=Data Source=/app/data/fitness.db
  #   volumes:
  #     - ./data:/app/data
  #   restart: unless-stopped